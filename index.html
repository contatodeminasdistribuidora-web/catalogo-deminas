<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#4a1705">
<title>De Minas Pão de Queijaria — Faça seu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-mockup.css">
<style>
  /* CSS de segurança mínimo, caso o tema falhe */
  body { margin:0; background:#fcf3e2; font-family:'Nunito Sans', sans-serif; padding-bottom:104px; }
  .cartbar { position:fixed; left:12px; right:12px; bottom:12px; background:#4a1705; color:#fff; border-radius:18px; display:flex; justify-content:space-between; padding:9px 18px; transform:translateY(140%); transition:transform .25s; z-index:40; }
  .cartbar.on { transform:none; }
  .hero { text-align:center; padding:14px 16px; }
  .hero img { width:min(250px,64vw); height:auto; margin:0 auto; display:block; }
  #stick { position:sticky; top:0; z-index:30; background:#4a1705; }
  #catalog { max-width:1100px; margin:0 auto; padding:0 16px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); margin-top:10px; }
  .card { display:flex; flex-direction:column; background:#fffaf0; border:1px solid #ecd7ab; border-radius:16px; padding:10px; }
  .card img { width:100%; height:180px; object-fit:cover; border-radius:10px; margin-bottom:8px; }
  .nm { font-family:'Fraunces', serif; font-size:18px; color:#4a1705; margin:0 0 4px; }
  .desc { font-size:13px; color:#7a5a45; margin:0 0 8px; }
  .opt { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px dashed #dcc590; }
  .pr { font-weight:800; color:#a7030e; }
  .add { background:#a7030e; color:#fff; border:0; border-radius:999px; padding:8px 16px; font-weight:800; cursor:pointer; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:10px 16px; }
  .chip { background:transparent; color:#fff; border:1px solid #fff; border-radius:999px; padding:6px 12px; white-space:nowrap; cursor:pointer; font-size:12px; }
</style>
</head>
<body>

<header class="hero">
  <img src="logo.jpg" alt="De Minas">
  <p>Escolha seus produtos e envie o pedido direto pelo WhatsApp</p>
</header>

<div id="stick">
  <div class="searchrow" style="padding:10px 16px;">
    <input id="q" type="search" placeholder="Buscar produto..." style="width:100%;border-radius:99px;border:0;padding:12px 20px;font-size:16px;">
  </div>
  <nav class="chips" id="chips"></nav>
</div>

<main id="catalog"><p style="text-align:center;padding:40px;">Carregando catálogo...</p></main>

<footer style="text-align:center;padding:20px;color:#7a5a45;font-size:13px;">
  <p>Rua Engenheiro Pegado, 332 — Vila Carrão, São Paulo/SP</p>
</footer>

<div class="cartbar" id="cartbar">
  <div><b id="cbTotal">R$ 0,00</b><br><small id="cbCount">0 itens</small></div>
  <button class="add" id="cbOpen">Ver pedido</button>
</div>

<!-- Modal do Carrinho -->
<div id="cartDlg" class="cartmodal" style="display:none;position:fixed;inset:0;background:#2a0d0399;z-index:50;align-items:flex-end;justify-content:center;">
  <div style="background:#fcf3e2;width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;border-radius:22px 22px 0 0;">
    <div style="padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ecd7ab;">
      <h3 style="margin:0;color:#4a1705;">Seu pedido</h3>
      <button id="cartClose" style="border:0;background:#f5e6c8;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;">×</button>
    </div>
    <div style="padding:16px;overflow-y:auto;flex:1;" id="cartItems"></div>
    <div style="padding:16px;border-top:1px solid #ecd7ab;background:#fffaf0;">
      <label style="display:block;margin-bottom:8px;font-size:14px;">Seu nome: <input type="text" id="cName" style="width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;"></label>
      <label style="display:block;margin-bottom:8px;font-size:14px;">WhatsApp (com DDD): <input type="tel" id="cTel" style="width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;"></label>
      <label style="display:block;margin-bottom:8px;font-size:14px;">Endereço: <input type="text" id="cAddr" style="width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;"></label>
      <div style="display:flex;justify-content:space-between;font-weight:800;margin:12px 0;">
        <span>Total:</span><span id="cartTotal" style="color:#a7030e;">R$ 0,00</span>
      </div>
      <button id="sendBtn" class="add" style="width:100%;padding:16px;font-size:16px;background:#128c4a;">Enviar pedido pelo WhatsApp</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyDj9wKSco9HEMNi7Iiu5xWZ1MqeZUpc5qQ",
    authDomain: "deminas-pedidos.firebaseapp.com",
    projectId: "deminas-pedidos",
    storageBucket: "deminas-pedidos.firebasestorage.app",
    messagingSenderId: "489232858438",
    appId: "1:489232858438:web:32e7bdfb10a44abb62b947"
  });
  const fdb = getFirestore(app);

  window.DM_enviarPedido = async function (pedido) {
    const id = pedido.codigo || ('DM-' + Date.now().toString(36).toUpperCase());
    const limpo = JSON.parse(JSON.stringify(pedido));
    await setDoc(doc(fdb, 'pedidosCatalogo', id), { ...limpo, id, status: 'novo', origem: 'catalogo', criadoEm: serverTimestamp() });
    return id;
  };
</script>

<script>
(() => {
'use strict';

// CATÁLOGO EMBUTIDO PARA NÃO DEPENDER DE ARQUIVOS EXTERNOS
const PRODUTOS = [
  { id:"1", cat:"congelados", nome:"Pão de Queijo Tradicional 30g", descricao:"Sabor da Roça", foto:"sabor-da-roca-pao-de-queijo-tradicional-30g-mve4kx69.jpg", opcoes:[{label:"1kg",preco:30}] },
  { id:"2", cat:"congelados", nome:"Pão de Queijo Coquetel 15g", descricao:"Sabor da Roça", foto:"sabor-da-roca-pao-de-queijo-coquetel-15g-mve4kyd0.jpg", opcoes:[{label:"2kgs",preco:60}] },
  { id:"3", cat:"congelados", nome:"Pão de Queijo Lanche 80g", descricao:"Sabor da Roça", foto:"pao-de-queijo.jpg", opcoes:[{label:"2kgs",preco:60}] },
  { id:"4", cat:"congelados", nome:"Pão de Queijo Super Lanche 100g", descricao:"Sabor da Roça", foto:"sabor-da-roca-pao-de-queijo-super-lanche-100g-mve4kzlw.jpg", opcoes:[{label:"2kgs",preco:60}] },
  { id:"5", cat:"congelados", nome:"Chipa com 3 Queijos", descricao:"Sabor da Roça", foto:"sabor-da-roca-chipa-com-3-queijos-mve4l0yy.jpg", opcoes:[{label:"1kg",preco:34}] },
  { id:"6", cat:"congelados", nome:"Biscoito de Queijo com 2 Queijos", descricao:"Sabor da Roça", foto:"sabor-da-roca-biscoito-de-queijo-com-2-queijos-mve4l26d.jpg", opcoes:[{label:"1kg",preco:32}] },
  { id:"7", cat:"congelados", nome:"Broa Doce", descricao:"Sabor da Roça", foto:"sabor-da-roca-broa-doce-mve4l3gz.jpg", opcoes:[{label:"1kg",preco:28.9}] },
  { id:"8", cat:"congelados", nome:"Broa Salgada", descricao:"Sabor da Roça", foto:"broa.jpg", opcoes:[{label:"1kg",preco:28.9}] },
  { id:"9", cat:"congelados", nome:"Pão de Queijo Tradicional 25g", descricao:"Bem de Minas", foto:"pao-de-queijo.jpg", opcoes:[{label:"1kg",preco:32.9}] },
  { id:"10", cat:"congelados", nome:"Recheado Costela", descricao:"Garcia de Minas", foto:"garcia-de-minas-recheado-costela-mve4l700.jpg", opcoes:[{label:"1kg",preco:42}] },
  { id:"11", cat:"congelados", nome:"Recheado Goiabada", descricao:"Garcia de Minas", foto:"garcia-de-minas-recheado-goiabada-mve4l8b2.jpg", opcoes:[{label:"1kg",preco:38}] },
  { id:"12", cat:"congelados", nome:"Recheado Frango", descricao:"Garcia de Minas", foto:"garcia-de-minas-recheado-frango-mve4l9mn.jpg", opcoes:[{label:"1kg",preco:38}] },
  { id:"13", cat:"congelados", nome:"Recheado Calabresa", descricao:"Garcia de Minas", foto:"garcia-de-minas-recheado-calabresa-mve4laws.jpg", opcoes:[{label:"1kg",preco:38}] },
  { id:"14", cat:"congelados", nome:"Recheado Requeijão", descricao:"Garcia de Minas", foto:"garcia-de-minas-recheado-requeijao-mve4lc2z.jpg", opcoes:[{label:"1kg",preco:38}] },
  { id:"15", cat:"congelados", nome:"Recheado Doce de Leite", descricao:"Garcia de Minas", foto:"garcia-de-minas-recheado-doce-de-leite-mve4ldey.jpg", opcoes:[{label:"1kg",preco:38}] },
  { id:"16", cat:"queijos", nome:"Queijo Fresco", descricao:"Canastra", foto:"queijo-fresco.jpg", opcoes:[{label:"Peça",preco:50}] },
  { id:"17", cat:"queijos", nome:"Queijo Canastra Medeiros", descricao:"Canastra", foto:"canastra-medeiros.jpg", opcoes:[{label:"Preço por kg",preco:80,kg:true}] },
  { id:"18", cat:"queijos", nome:"Queijo Serra da Canastra", descricao:"Canastra", foto:"serra-da-canastra.jpg", opcoes:[{label:"Preço por kg",preco:67,kg:true}] },
  { id:"19", cat:"queijos", nome:"Queijo Meia Cura Araxá", descricao:"Canastra", foto:"meia-cura-araxa.jpg", opcoes:[{label:"Preço por kg",preco:75,kg:true}] },
  { id:"20", cat:"doces", nome:"Doce de Leite Moreno", descricao:"Artesanal", foto:"dl-moreno.jpg", opcoes:[{label:"Pote",preco:36}] },
  { id:"21", cat:"doces", nome:"Goiabada Cascão de Corte", descricao:"Artesanal", foto:"goiabada-corte-cascao.jpg", opcoes:[{label:"400g",preco:24}] },
  { id:"22", cat:"doces", nome:"Doce de Leite na Palha", descricao:"Artesanal", foto:"dl-na-palha.jpg", opcoes:[{label:"Unidade",preco:30}] },
  { id:"23", cat:"mel", nome:"Mel Florada Silvestre", descricao:"Puro", foto:"mel-silvestre.jpg", opcoes:[{label:"250g",preco:25},{label:"500g",preco:40}] },
  { id:"24", cat:"biscoitos", nome:"Casadinho de Goiabada", descricao:"Artesanal", foto:"casadinho.jpg", opcoes:[{label:"Pote",preco:20}] },
  { id:"25", cat:"biscoitos", nome:"Biscoito de Queijo Canastra", descricao:"Artesanal", foto:"biscoito-canastra.jpg", opcoes:[{label:"Pacote",preco:22}] }
];

const S = { cart: JSON.parse(localStorage.getItem('dm_cart') || '{}'), q: '' };
const $ = (s) => document.querySelector(s);
const brl = n => n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});

function render() {
  const cats = [
    {id:'congelados', nome:'Pães de Queijo'},
    {id:'queijos', nome:'Queijos'},
    {id:'doces', nome:'Doces'},
    {id:'mel', nome:'Mel'},
    {id:'biscoitos', nome:'Biscoitos'}
  ];
  
  let html = '';
  let anchors = [{key:'c0', label:'Todos'}];
  
  cats.forEach(c => {
    const prods = PRODUTOS.filter(p => p.cat === c.id && (!S.q || p.nome.toLowerCase().includes(S.q.toLowerCase())));
    if(!prods.length) return;
    
    anchors.push({key:c.id, label:c.nome});
    html += `<section id="a-${c.id}" style="padding-top:24px;"><h2 style="font-size:24px;color:#4a1705;margin-bottom:10px;">${c.nome}</h2><div class="grid">`;
    
    prods.forEach(p => {
      html += `<div class="card">
        <img src="${p.foto}" alt="${p.nome}" onerror="this.style.display='none'">
        <h3 class="nm">${p.nome}</h3>
        <p class="desc">${p.descricao}</p>
        ${p.opcoes.map(o => `
          <div class="opt">
            <div><span style="font-size:12px;color:#7a5a45;">${o.label}</span><br><span class="pr">${brl(o.preco)}</span></div>
            <button class="add" onclick="addCart('${p.id}||${o.label}')">Adicionar</button>
          </div>
        `).join('')}
      </div>`;
    });
    html += `</div></section>`;
  });
  
  $('#catalog').innerHTML = html;
  $('#chips').innerHTML = anchors.map(a => `<button class="chip" onclick="document.getElementById('a-${a.key}').scrollIntoView({behavior:'smooth'})">${a.label}</button>`).join('');
  renderCartBar();
}

window.addCart = (k) => {
  S.cart[k] = (S.cart[k] || 0) + 1;
  localStorage.setItem('dm_cart', JSON.stringify(S.cart));
  renderCartBar();
};

function renderCartBar() {
  const items = Object.values(S.cart).reduce((a,b)=>a+b,0);
  let total = 0;
  for(const [k, q] of Object.entries(S.cart)) {
    const [pid, label] = k.split('||');
    const p = PRODUTOS.find(x => x.id === pid);
    const o = p && p.opcoes.find(x => x.label === label);
    if(o) total += o.preco * q;
  }
  $('#cbTotal').textContent = brl(total);
  $('#cbCount').textContent = items + (items === 1 ? ' item' : ' itens');
  $('#cartbar').classList.toggle('on', items > 0);
}

$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('#cbOpen').onclick = () => {
  const items = Object.values(S.cart).reduce((a,b)=>a+b,0);
  if(!items) return alert('Adicione produtos primeiro!');
  
  let html = '';
  for(const [k, q] of Object.entries(S.cart)) {
    const [pid, label] = k.split('||');
    const p = PRODUTOS.find(x => x.id === pid);
    const o = p && p.opcoes.find(x => x.label === label);
    if(o) html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;"><span>${q}x ${p.nome} (${label})</span><span style="font-weight:bold;">${brl(o.preco * q)}</span></div>`;
  }
  $('#cartItems').innerHTML = html;
  $('#cartTotal').textContent = $('#cbTotal').textContent;
  $('#cartDlg').style.display = 'flex';
};
$('#cartClose').onclick = () => $('#cartDlg').style.display = 'none';

$('#sendBtn').onclick = async () => {
  const nome = $('#cName').value.trim();
  const tel = $('#cTel').value.trim().replace(/\D/g,'');
  const addr = $('#cAddr').value.trim();
  
  if(!nome || !tel || !addr) return alert('Preencha nome, WhatsApp e endereço.');
  
  let msg = `*Pedido - De Minas Pão de Queijaria*\n\n*Nome:* ${nome}\n*WhatsApp:* ${tel}\n*Endereço:* ${addr}\n\n*Itens:*\n`;
  let total = 0;
  
  for(const [k, q] of Object.entries(S.cart)) {
    const [pid, label] = k.split('||');
    const p = PRODUTOS.find(x => x.id === pid);
    const o = p && p.opcoes.find(x => x.label === label);
    if(o) {
      msg += `• ${q}x ${p.nome} (${label}) - ${brl(o.preco * q)}\n`;
      total += o.preco * q;
    }
  }
  
  msg += `\n*Total: ${brl(total)}*`;
  
  // Envia pro Firebase (ERP)
  try {
    if (window.DM_enviarPedido) {
      await window.DM_enviarPedido({
        codigo: 'DM-' + Date.now().toString(36).toUpperCase(),
        cliente: nome, whatsapp: tel, endereco: addr,
        itens: [], total: total, tipo: 'Entrega', pagamento: 'PIX', obs: ''
      });
      alert('✅ Pedido enviado para o sistema!');
    }
  } catch(e) { console.error(e); }
  
  window.open('https://wa.me/5511986975803?text=' + encodeURIComponent(msg), '_blank');
  
  S.cart = {};
  localStorage.removeItem('dm_cart');
  renderCartBar();
  $('#cartDlg').style.display = 'none';
  render();
};

render();
})();
</script>
<script src="tema-mockup.js" defer></script>
</body>
</html>
